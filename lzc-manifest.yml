application:
  subdomain: poster
  multi_instance: false
  routes:
    - /=http://poster:80/

services:
  poster:
    # lazycat-action 会在构建 LPK 前将这个上游地址替换成 copy-image 返回的官方地址。
    image: ghcr.io/wcaqrl/poster:0.1.0
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
